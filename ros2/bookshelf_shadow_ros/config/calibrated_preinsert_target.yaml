# Read-only geometric target for the static AU bookshelf experiment.
# These calibrated values do not authorize robot motion.
calibrated_preinsert_target:
  ros__parameters:
    base_frame: link_base
    ee_frame: link_eef
    tcp_frame: link_tcp

    # Default physical workflow: keep the first fresh live link_tcp
    # orientation after this node starts. Use book_aligned only for comparison.
    target_orientation_mode: preserve_current_tcp
    maximum_preserved_book_orientation_error_deg: 15.0

    # Static RGB-D slot estimate from the unobstructed 2026-08-04 recording.
    static_slot_translation_xyz:
      - 0.8741794456118123
      - 0.0807494671987291
      - 0.2473493846631505
    static_slot_quaternion_xyzw:
      - 0.002228045026061973
      - 0.0499056226703669
      - 0.05101853094791474
      - 0.9974475295177995
    static_slot_width_m: 0.036050625653429466
    static_slot_confidence: 0.730982856317
    static_slot_transform_status: measured_rgbd_static_no_absolute_ground_truth

    # Rigid-grasp calibration from ArUco Original ID 0 on 2026-08-05.
    eef_book_translation_xyz:
      - 0.008124357683356356
      - -0.010156856549182705
      - 0.12425871757162561
    eef_book_quaternion_xyzw:
      - 0.47569361268145194
      - 0.46802866719711034
      - 0.5317004002617697
      - 0.5214973038254745
    eef_book_transform_status: measured_aruco_original_id0_static_grasp

    # Deliberately unverified until policy_tool_frame_audit selects a real or
    # virtual gripper tool point. Geometry remains reportable; PPO input does not.
    eef_policy_tool_translation_xyz: [0.0, 0.0, 0.0]
    eef_policy_tool_quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]
    policy_tool_transform_status: link_eef_identity_unverified

    # Matches the trained residual environment's pre-insertion convention.
    book_size_xyz: [0.156, 0.034, 0.236]
    slot_depth_m: 0.20
    preinsert_standoff_m: 0.030
    preinsert_vertical_offset_m: 0.006
    target_gripper_open: 0.0

    rear_to_mouth_obs_scale: 0.08
    front_to_back_obs_scale: 0.08
    lat_err_obs_scale: 0.05
    z_err_obs_scale: 0.05
    yaw_err_obs_scale_deg: 30.0
    tool_to_book_obs_scale: 0.25

    # Report how bounded calibration error propagates to the book target.
    sensitivity_samples: 2000
    translation_uncertainty_m: 0.002
    rotation_uncertainty_deg: 2.0
    sensitivity_seed: 42

    publish_rate_hz: 5.0
    tf_lookup_timeout_s: 0.05
    tf_max_age_s: 0.50
    report_write_period_s: 1.0
    output_dir: /tmp/bookshelf_calibrated_target

    valid_topic: /bookshelf_shadow/calibrated_target_valid
    target_book_pose_topic: /bookshelf_shadow/target_book_pose
    target_eef_pose_topic: /bookshelf_shadow/target_eef_pose
    target_tcp_pose_topic: /bookshelf_shadow/target_tcp_pose
    target_policy_tool_pose_topic: /bookshelf_shadow/target_policy_tool_pose
    current_book_pose_topic: /bookshelf_shadow/current_book_pose
    current_eef_pose_topic: /bookshelf_shadow/current_eef_pose
    current_tcp_pose_topic: /bookshelf_shadow/current_tcp_pose
    target_raw_metrics_topic: /bookshelf_shadow/target_raw_metrics
    target_observation_topic: /bookshelf_shadow/target_observation_12d
    debug_topic: /bookshelf_shadow/calibrated_target_debug
