# Markerless integration configuration. This package never commands the robot.
#
# The fixed link_eef-to-book transform below is an approximate smoke-test value.
# Calibrate it before treating the resulting observation as geometrically exact.
policy_observation_adapter:
  ros__parameters:
    base_frame: link_base
    ee_frame: link_eef
    target_book_frame: target_book_center

    book_pose_source: eef_fixed
    latch_eef_book_from_marker: false
    use_configured_eef_book_transform: true
    eef_book_translation_xyz: [0.0, 0.0, 0.075]
    eef_book_quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]
    eef_book_transform_status: approximate_smoke_only

    slot_pose_topic: /slot_detector/slot_pose
    slot_width_topic: /slot_detector/slot_width
    confidence_topic: /slot_detector/confidence
    joint_states_topic: /joint_states
    mode_topic: /bookshelf_policy/mode

    raw_metrics_topic: /bookshelf_policy/raw_metrics
    observation_topic: /bookshelf_policy/observation_12d
    valid_topic: /bookshelf_policy/observation_valid
    slot_pose_base_topic: /bookshelf_policy/slot_pose_base
    book_pose_base_topic: /bookshelf_policy/book_pose_base
    debug_topic: /bookshelf_policy/adapter_debug

    book_size_xyz: [0.156, 0.034, 0.236]
    slot_depth_m: 0.20
    slot_target_offset_xyz: [0.0, 0.0, 0.0]
    tool_offset_xyz: [0.0, 0.0, 0.0]
    minimum_slot_width_m: 0.020
    maximum_slot_width_m: 0.090
    minimum_confidence: 0.60

    gripper_joint_name: drive_joint
    gripper_open_joint_position: 0.0
    gripper_closed_joint_position: 0.85

    rear_to_mouth_obs_scale: 0.08
    front_to_back_obs_scale: 0.08
    lat_err_obs_scale: 0.05
    z_err_obs_scale: 0.05
    yaw_err_obs_scale_deg: 30.0
    tool_to_book_obs_scale: 0.25

    default_mode: 0
    publish_rate_hz: 20.0
    message_max_age_s: 0.50
    tf_max_age_s: 0.50
    check_source_header_age: true
    tf_lookup_timeout_s: 0.05
