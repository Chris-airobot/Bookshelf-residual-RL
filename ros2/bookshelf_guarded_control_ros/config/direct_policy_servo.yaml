direct_policy_servo:
  ros__parameters:
    base_frame: link_base
    eef_frame: link_eef
    tcp_frame: link_tcp
    start_servo_service: /servo_server/start_servo
    twist_command_topic: /servo_server/delta_twist_cmds

    control_rate_hz: 30.0
    policy_command_duration_s: 0.20
    maximum_linear_speed_m_s: 0.025
    maximum_angular_speed_rad_s: 0.10
    translation_tolerance_m: 0.0005
    rotation_tolerance_rad: 0.004363323129985824
    message_max_age_s: 0.50
    tf_max_age_s: 0.50
    tf_lookup_timeout_s: 0.02
    command_scale: 1.0

    # Filled from the reviewed trial configuration by the deployment launch.
    eef_tcp_translation_xyz: [0.0, 0.0, 0.0]
    eef_tcp_quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]

    maximum_policy_delta:
      - 0.008
      - 0.003
      - 0.007
      - 0.013962634015954637
      - 0.010471975511965976
    maximum_tcp_translation_step_m: 0.010
    maximum_tcp_rotation_step_rad: 0.026179938779914945
    workspace_min_xyz: [0.20, -0.60, 0.05]
    workspace_max_xyz: [1.00, 0.60, 1.00]

    blocked_node_names:
      - guarded_policy_tool_executor
      - policy_tool_plan_checker
      - policy_to_robot_node
      - cartesian_action_executor_node
      - action_executor_node

    observation_valid_topic: /bookshelf_policy/observation_valid
    inference_valid_topic: /bookshelf_shadow/inference_valid
    final_delta_topic: /bookshelf_shadow/final_delta
    slot_pose_base_topic: /bookshelf_policy/slot_pose_base
    adapter_debug_topic: /bookshelf_policy/adapter_debug
    policy_debug_topic: /bookshelf_shadow/policy_debug
    command_valid_topic: /bookshelf_control/command_valid
    status_topic: /bookshelf_control/status
    target_tcp_topic: /bookshelf_control/target_tcp
